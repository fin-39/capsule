name: AppImage

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build and bundled runtime dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          git rust gtk4 libadwaita libx11 pkgconf
          e2fsprogs fuse2fs fuse3 bubblewrap gamescope xorg-xwayland wine
          python python-pip 7zip imagemagick
          slirp4netns nftables wl-clipboard curl
      - uses: actions/checkout@v4
      - name: Verify release tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match Cargo.toml ($expected)" >&2
            exit 1
          fi
      - name: Download the official AppImage build tool
        run: |
          mkdir -p target
          curl --fail --location --proto '=https' \
            --output target/appimagetool-x86_64.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod 0755 target/appimagetool-x86_64.AppImage
      - name: Build the one-file release
        env:
          APPIMAGETOOL: ${{ github.workspace }}/target/appimagetool-x86_64.AppImage
        run: ./scripts/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Capsule-AppImage
          path: |
            dist/*.AppImage
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: appimage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Capsule-AppImage
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/*.AppImage
          release-assets/*.sha256
          --verify-tag
          --generate-notes
          --title "Capsule $GITHUB_REF_NAME"
