# A private virtual sink for playback-only capsules. Its playback stream is
# linked to the user's current default output by WirePlumber. Restricted
# Capsule clients can see this sink and its monitor, but no physical capture
# source or unrelated output sink.
context.modules = [
    {
        name = libpipewire-module-loopback
        args = {
            node.description = "Capsule Playback"
            audio.position = [ FL FR ]
            capture.props = {
                node.name = "capsule_playback"
                media.class = "Audio/Sink"
                node.virtual = true
                priority.session = 1
            }
            playback.props = {
                node.name = "playback.capsule_playback"
                node.dont-reconnect = false
            }
        }
    }
]
