# Dedicated Pulse-compatible endpoint for Capsule's Playback-only permission.
# The matching WirePlumber rule assigns clients on this socket a permission
# manager which hides every host audio source.
pulse.properties = {
    server.address = [
        "unix:native"
        {
            address = "unix:capsule-playback-native"
            client.access = "capsule-playback"
        }
    ]
}

# Pulse clients normally leave their stream target implicit and WirePlumber
# then chooses a host-wide default device. Restricted clients cannot see those
# devices, so pin both directions to Capsule's virtual sink: playback reaches
# the sink and Wine's capture probe reaches only that sink's private monitor.
pulse.rules = [
    {
        matches = [
            {
                pipewire.client.access = "capsule-playback"
            }
        ]
        actions = {
            update-props = {
                target.object = "capsule_playback"
            }
        }
    }
]

# Keep the restricted Pulse stream itself at unity gain. Wine applies Windows
# application/session volume while writing the PCM samples, but some games
# also cause the host stream's channel volumes to be rewritten (occasionally
# to zero) after a desktop mixer changes them. Locking only this adapter's
# host-side volume prevents that feedback loop; Capsule Playback's loopback
# stream remains the desktop-side volume control.
stream.rules = [
    {
        matches = [
            {
                pipewire.client.access = "capsule-playback"
                media.class = "Stream/Output/Audio"
            }
        ]
        actions = {
            update-props = {
                channelmix.lock-volumes = true
            }
        }
    }
]
