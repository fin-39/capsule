# Clients from Capsule's dedicated Pulse endpoint may see and use Capsule's
# virtual sink and its private monitor, but cannot see host microphones, other
# sink monitors or physical output sinks.
access.permission-managers = [
    {
        name = "capsule-playback"
        default_permissions = "rx"
        core_permissions = "rx"
        rules = [
            {
                matches = [
                    { media.class = "~Audio/Source.*" }
                ]
                actions = {
                    set-permissions = "-"
                }
            }
            {
                matches = [
                    { media.class = "Audio/Sink" }
                ]
                actions = {
                    set-permissions = "-"
                }
            }
            {
                matches = [
                    { node.name = "capsule_playback" }
                ]
                actions = {
                    set-permissions = "rx"
                }
            }
        ]
    }
]

access.rules = [
    {
        matches = [
            { access = "capsule-playback" }
        ]
        actions = {
            update-props = {
                permission_manager_name = "capsule-playback"
            }
        }
    }
]

# Do not inherit a host-side per-application volume for restricted Capsule
# playback streams. Wine applications may repeatedly recreate their Pulse
# stream, and WirePlumber would otherwise restore a stale zero-volume entry on
# every recreation. The application's own mixer remains effective; this only
# makes each new host stream start at unity gain.
stream.rules = [
    {
        matches = [
            {
                pipewire.client.access = "capsule-playback"
                media.class = "Stream/Output/Audio"
            }
        ]
        actions = {
            update-props = {
                state.restore-props = false
                state.default-volume = 1.0
            }
        }
    }
]
